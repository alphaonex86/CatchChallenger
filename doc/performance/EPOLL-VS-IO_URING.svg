<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="716" viewBox="0 0 1500 716"><rect width="1500" height="716" fill="#ffffff"/><text x="750.0" y="40.0" font-size="25" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">epoll vs io_uring - CatchChallenger server</text><text x="750.0" y="64.0" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">Geode LX800 - 250 bots @ 250 ms - same fixed work, same seed - 7 runs each, 14/14 valid</text><rect x="30.0" y="92.0" width="468.0" height="368.0" fill="#fbfbfb" stroke="#dddddd" fill-opacity="1.0" rx="6"/><text x="46.0" y="118.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, sans-serif">CPU for the same work</text><text x="484.0" y="118.0" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">MEASURED - schedstat, ns</text><rect x="122.0" y="210.2" width="114.0" height="153.8" fill="#1f77b4" stroke="none" fill-opacity="0.85" rx="3"/><text x="179.0" y="196.2" font-size="21" fill="#1f77b4" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">318 us</text><line x1="179.0" y1="219.4" x2="179.0" y2="204.0" stroke="#1a1a1a" stroke-width="2"/><line x1="170.0" y1="219.4" x2="188.0" y2="219.4" stroke="#1a1a1a" stroke-width="2"/><line x1="170.0" y1="204.0" x2="188.0" y2="204.0" stroke="#1a1a1a" stroke-width="2"/><text x="179.0" y="388.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">epoll</text><rect x="292.0" y="225.2" width="114.0" height="138.8" fill="#d62728" stroke="none" fill-opacity="0.85" rx="3"/><text x="349.0" y="211.2" font-size="21" fill="#d62728" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">287 us</text><line x1="349.0" y1="231.8" x2="349.0" y2="221.6" stroke="#1a1a1a" stroke-width="2"/><line x1="340.0" y1="231.8" x2="358.0" y2="231.8" stroke="#1a1a1a" stroke-width="2"/><line x1="340.0" y1="221.6" x2="358.0" y2="221.6" stroke="#1a1a1a" stroke-width="2"/><text x="349.0" y="388.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">io_uring</text><line x1="70.0" y1="364.0" x2="458.0" y2="364.0" stroke="#1a1a1a" stroke-width="1.5"/><text x="264.0" y="416.0" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">microseconds of CPU per move packet</text><text x="264.0" y="440.0" font-size="16" fill="#2ca02c" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">io_uring is -9.8 %</text><text x="264.0" y="460.0" font-size="12" fill="#2ca02c" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">ranges do not overlap: worst io_uring 294 &lt; best epoll 299</text><rect x="516.0" y="92.0" width="468.0" height="368.0" fill="#fbfbfb" stroke="#dddddd" fill-opacity="1.0" rx="6"/><text x="532.0" y="118.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, sans-serif">Resident memory</text><text x="970.0" y="118.0" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">MEASURED - VmHWM</text><rect x="608.0" y="231.2" width="114.0" height="132.8" fill="#1f77b4" stroke="none" fill-opacity="0.85" rx="3"/><text x="665.0" y="217.2" font-size="21" fill="#1f77b4" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">9.70 MB</text><text x="665.0" y="388.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">epoll</text><rect x="778.0" y="204.0" width="114.0" height="160.0" fill="#d62728" stroke="none" fill-opacity="0.85" rx="3"/><text x="835.0" y="190.0" font-size="21" fill="#d62728" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">11.69 MB</text><text x="835.0" y="388.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">io_uring</text><line x1="556.0" y1="364.0" x2="944.0" y2="364.0" stroke="#1a1a1a" stroke-width="1.5"/><text x="750.0" y="416.0" font-size="16" fill="#b00020" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">io_uring costs +1.99 MB</text><text x="750.0" y="440.0" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">the provided-buffer ring (sized from max-players)</text><text x="750.0" y="460.0" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">plus one output buffer per client for the queued sends</text><rect x="1002.0" y="92.0" width="468.0" height="368.0" fill="#fbfbfb" stroke="#dddddd" fill-opacity="1.0" rx="6"/><text x="1018.0" y="118.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, sans-serif">Why it did not show before</text><text x="1456.0" y="118.0" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">MEASURED - 3 tree states</text><rect x="1048.0" y="210.7" width="42.0" height="153.3" fill="#1f77b4" stroke="none" fill-opacity="0.85" rx="2"/><rect x="1094.0" y="210.7" width="42.0" height="153.3" fill="#d62728" stroke="none" fill-opacity="0.85" rx="2"/><text x="1092.0" y="200.7" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">0 %</text><text x="1092.0" y="386.0" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">recv only</text><rect x="1180.0" y="207.6" width="42.0" height="156.4" fill="#1f77b4" stroke="none" fill-opacity="0.85" rx="2"/><rect x="1226.0" y="204.0" width="42.0" height="160.0" fill="#d62728" stroke="none" fill-opacity="0.85" rx="2"/><text x="1224.0" y="194.0" font-size="13" fill="#b00020" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">+2.3 %</text><text x="1224.0" y="386.0" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">send/ring,</text><text x="1224.0" y="400.0" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">per send</text><rect x="1312.0" y="210.6" width="42.0" height="153.4" fill="#1f77b4" stroke="none" fill-opacity="0.85" rx="2"/><rect x="1358.0" y="225.6" width="42.0" height="138.4" fill="#d62728" stroke="none" fill-opacity="0.85" rx="2"/><text x="1356.0" y="200.6" font-size="13" fill="#2ca02c" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">-9.8 %</text><text x="1356.0" y="386.0" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">send/ring,</text><text x="1356.0" y="400.0" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">batched</text><line x1="1032.0" y1="364.0" x2="1440.0" y2="364.0" stroke="#1a1a1a" stroke-width="1.5"/><text x="1236.0" y="426.0" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">blue epoll / red io_uring - us per move</text><text x="1236.0" y="450.0" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">the win needs the sends batched, not just on the ring</text><rect x="30.0" y="486.0" width="1440.0" height="210.0" fill="#fbfbfb" stroke="#dddddd" fill-opacity="1.0" rx="6"/><text x="46.0" y="512.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, sans-serif">Reading this</text><text x="46.0" y="536.0" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">*</text><text x="62.0" y="536.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">With 250 players on ONE map each incoming move is broadcast to the other ~249. io_uring used to cover the RECEIVE side only, so it saved ~1 syscall out of ~250 and measured indistinguishable from epoll.</text><text x="46.0" y="555.0" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">*</text><text x="62.0" y="555.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">Putting those sends on the ring is not enough by itself: submitting each one immediately just swaps ::send() for io_uring_enter() and adds a copy -- measured SLOWER (+2.3 %).</text><text x="46.0" y="574.0" font-size="11" fill="#2ca02c" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">*</text><text x="62.0" y="574.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">The win comes from batching: SQEs accumulate and wait() flushes the whole tick in ONE io_uring_submit_and_wait, so ~249 sends cost one syscall instead of 249.</text><text x="46.0" y="593.0" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">*</text><text x="62.0" y="593.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">Ordering is enforced by one per-socket in-flight counter shared by the datapack send chain and ordinary writes; a write only becomes an SQE when nothing else is outstanding on that fd, otherwise it is queued.</text><text x="46.0" y="612.0" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">*</text><text x="62.0" y="612.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">Measured where the CPU can actually be loaded: the Geode calibrates to 11.5 % of one core at 250 bots. A 7950X3D could not be pushed past 0.43 % by any bot count the 8-bit per-map player index allows (250).</text><text x="46.0" y="631.0" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">*</text><text x="62.0" y="631.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">Both backends run the SAME fixed work with the same seed -- a fixed TIME window is not comparable, because the bots act as fast as the server answers.</text><text x="46.0" y="650.0" font-size="11" fill="#b00020" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">*</text><text x="62.0" y="650.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">Not plotted: requests/s. BENCH packets_in is incremented only on the epoll readiness path, so io_uring always reads 0 -- not measured, not a result.</text><text x="46.0" y="669.0" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">*</text><text x="62.0" y="669.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">Earlier figures claiming -24 % or +10 % came from mixing completed runs with runs truncated at a timeout. Those are withdrawn.</text></svg>