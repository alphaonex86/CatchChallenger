; Force the BUILDING STYLE of a town by name.
;
;   <city name> = <template/<name>-city folder>
;
; The generator normally picks the style from the terrain around the town
; ([building] cityStyleTerrains in settings.ini). A line here overrides that for
; one town, so the places the world is built around can be given the look they
; are meant to have.
;
; The name is the one from cities.txt, case insensitive. A line naming a folder
; that does not exist under template/ is reported and ignored.
;
; Styles shipped today: brown-city, desert-city, flat-roof-city, med-city,
; paris-city, red-city, sea-city. Drop a new folder in template/ and it is
; usable here immediately — nothing to declare.
;
; Examples (commented out: the file ships empty on purpose, the terrain match is
; a good default and a forced style that fights its surroundings looks worse
; than no rule at all).
;
;allar=brown-city
;anglandope=paris-city
;scarf=flat-roof-city
