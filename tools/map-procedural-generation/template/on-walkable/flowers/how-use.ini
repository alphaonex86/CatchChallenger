; A tuft of flowers: common, and several per map when it appears. The art is
; drawn for the grass, so it asks for the grass with "terrains=" - the parent
; folder on-walkable/ only asks for ground the player can walk on.
;
; mapPercent  = chance this decoration is used at all on a map
; min / max   = how many copies when it IS used
; terrains    = see template/on-walkable/big-tree/how-use.ini for the full syntax
[use]
mapPercent=60
min=4
max=12
terrains=grass
