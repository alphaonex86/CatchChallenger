; A lone big tree, on any ground the player can walk on.
;
; The parent folder on-walkable/ is the GENERIC decoration group: a copy lands
; wherever every cell of its footprint is walkable (a Walkable tile, no
; Collisions, no WalkBehind). The tree ITSELF is a collision, that is fine: what
; must be free is the ground it is planted on.
;
; mapPercent  = chance this decoration is used at all on a map
; min / max   = how many copies when it IS used
; terrains    = optional, empty = any terrain. "," or ";" separated, and one
;               entry is either a terrain name or "<terrain>-><neighbour>": on
;               that terrain, TOUCHING that other one. The list is an OR, so
;                 terrains="sand->water;sand->grass;grass"
;               reads "on the sand by the water, or on the sand by the grass, or
;               on the grass". A name matches as a prefix, so "sand" also covers
;               the "sand2" terrain.
;               QUOTE the value when it holds a ";": unquoted, everything after
;               it is an ini comment (the generator says so, it never drops it
;               in silence). Commas need no quotes.
; cityTypes   = optional, empty = any map; "big,medium" restricts it to those towns
[use]
mapPercent=25
min=1
max=3
