; A cargo ship moored on the open water of a sea route, with a trainer waiting
; beside it. Same shape as template/on-<terrain>/: one tmx of REAL drawn tiles
; (here tileset/ships.tsx), brushed with its own layers.
;
; A template/sea/ decoration is only ever placed on a SWIMMABLE lane, inside the
; rock, and never where it would close the way: the whole footprint plus a ring
; of one tile around it has to be open lane water.
;
; mapPercent  = chance this decoration is used at all on a sea route map
; min / max   = how many copies when it IS used
[use]
mapPercent=50
min=1
max=1
