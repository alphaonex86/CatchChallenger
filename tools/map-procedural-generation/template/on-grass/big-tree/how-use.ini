; A lone big tree standing on the open grass.
;
; mapPercent  = chance this decoration is used at all on a map whose ground is
;               the terrain of the parent folder (on-grass -> [terrain] grass)
; min / max   = how many copies when it IS used
; terrains    = optional extra filter, empty = the parent folder decides
; cityTypes   = optional, empty = any map; "big,medium" restricts it to those towns
[use]
mapPercent=25
min=1
max=3
