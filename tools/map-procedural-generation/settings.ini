[General]
cityRadius=3
; drop from dest/map/tileset/ + dest/map/main/tileset/ every tileset no generated
; map references. Those dirs are only a RUN STAGING POOL, refilled at each start
; from the tool's own tileset/ (and from --datapack), so this is not destructive.
cleanTileset=true
; Object layer "City" in all.tmx: the hole polygon of every town plus a one line
; label (name, size, level, element type, house style, chunk, hole, density
; reached / limit, buildings placed / minimum)
cityDebug=true
displaycity=false
displayregion=false
displayzone=false
doallmap=true
dominimap=true
dotransition=true
dovegetation=true
levelmapmax=50
levelmapmin=2
levelmapscale=0.05
; the map LABEL the world is written under: dest/map/main/<maincode>/. Spelled
; out so the generator never has to add it back: this file is the one the build
; directories link to, and a write-back would strip these comments.
maincode=generated
mapHeight=44
mapWidth=44
mapXCount=32
mapYCount=32
maxCityLinks=3
miniMapDivisor=4.0
scale_City=3
scale_TerrainMap=0.03
scale_TerrainMoisure=0.1
scale_Zone=0.1
seed=400
tileStep=4

[city]
; Per SIZE (small / medium / big).
; template: avenue/plaza path terrain comes from this template tmx
;   (template/<name>.tmx): Walkable fill tile = path terrain, OnGrass 3x3 ring =
;   border. Edit the tmx in Tiled to change the terrain. useAsBase=true brushes
;   the tmx itself, centered, as the city base ground.
; signTiles: "tileset/idx" list; ONE style is picked per city (signs near the
;   border at the avenue entrances).
; holePercent: the HOLE the town is laid out in, percent of the chunk, centered.
;   Outside it the terrain stays natural and keeps its trees, which is what makes
;   a small town read as a village instead of one house lost in a 44x44 field.
;   Always clamped to leave a 5-tile vegetation ring against the chunk border.
; densityPercent: max share of that hole the building COLLISION footprints may
;   take. A building that would push the total over is denied (upper limit, it
;   cannot be hit exactly).
; minBuilding: how many buildings to TRY for, NOT counting the heal and the
;   market (always placed first). Best effort — density and free ground decide.
small\template=city-small
small\useAsBase=false
small\signTiles="t1.tsx/100"
small\holePercent=55
small\densityPercent=45
small\minBuilding=2
medium\template=city-medium
medium\useAsBase=false
medium\signTiles="t1.tsx/100"
medium\holePercent=75
medium\densityPercent=40
medium\minBuilding=4
big\template=city-big
big\useAsBase=false
big\signTiles="t1.tsx/100,t1.tsx/103"
big\holePercent=100
big\densityPercent=40
big\minBuilding=6
; flatten: force the height/moisure noise under a town to its DOMINANT terrain,
; so a city is never cut in half by two terrains. flattenShape picks the area:
; rectangle (the whole chunk), circle or octagon - all three are one polygon.
; flattenMargin shrinks it in tiles; flattenFalloff is how many tiles the terrain
; takes to ramp from the town level back to the natural noise (the gradient
; restarts at the town level, so no mountain wall lands on the town border).
flatten=true
flattenShape=rectangle
flattenMargin=0
flattenFalloff=44

