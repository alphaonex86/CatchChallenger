[road]
; extraSpacePercent*: how much of a road chunk is FILLED with walkable content
; (the path plus the grass/water blobs) beyond the minimum needed to join its
; borders. Low = a simple track crossing an untouched landscape, high = most of
; the chunk is walkable. Rolled once per chunk with a TRIANGULAR distribution,
; so most roads sit in the middle of the range and the extremes stay rare.
; variance scales how far a chunk may go from that middle: 0 pins every chunk to
; it (one uniform world), 100 uses the whole min..max range.
extraSpacePercentMin=8
extraSpacePercentMax=65
extraSpacePercentVariance=100
; cave\*: this percent of road chunks becomes a CAVE (corridor walled with
; wallTile, ground floorTile, map type=cave + cave encounters)
cave\percent=15
; wall = 3x3 repeating rock block (9 tiles), entrance = the cave mouth tile;
; maxDepth: a cave may chain up to N floors (stairDown/stairUp tiles, +2
; monster levels per floor); itemPercent chance per floor of one ground item
; from the items id list (itemTile is the visual)
cave\wallTile="t1.tsx/640,t1.tsx/641,t1.tsx/642,t1.tsx/672,t1.tsx/673,t1.tsx/674,t1.tsx/704,t1.tsx/705,t1.tsx/706"
cave\floorTile=Terra/38
cave\entranceTile=t1.tsx/749
; mouth when the cliff faces top; interior exits embedded in the ring line:
; exitBottomTile = push to leave toward the bottom, exitTopTile = walkable
; gap, walk onto it to leave toward the top
cave\entranceTopTile=Terra/19
cave\exitBottomTile=Terra/402
cave\exitTopTile=Terra/403
cave\stairDownTile=rename/194
cave\stairUpTile=rename/193
cave\itemTile=rename/161
cave\maxDepth=3
cave\itemPercent=60
