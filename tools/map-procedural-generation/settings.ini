[building]
; gymTypes: each gym picks one type; part of the trainer teams comes from the
; type monster pool and the gym facade is recolored with the type color
; (gym-<type> tileset generated into dest/map/tileset/ from tileset/gym.png).
; Colors copied from CatchChallenger-datapack/monsters/type.xml; typeXml can
; point to that file to read them at runtime instead.
gymTypes="fire:#f38233->Panthera fira,Vivicinder;water:#2E9EF3->Dinoflop,Pharfan,Rhinocarpe;plant:#71DA5E->Conileaf,Viviphyta,Cowpignon;poison:#B46DC5->Chenipode,Exapode,Snaki;electric:#FFEC10->Coleorus,Vivitron;stone:#BF904E->Polyrock,Selket,Galnec;ice:#75E7F3->Toufigel"
; a city takes the type whose terrain keywords match its surroundings; the
; gym type follows the city type; counts stay balanced across the world
cityTypeTerrains="water->water;stone->mountain,sand;plant->grass;ice->snow"
; cityStyleTerrains: which template/<style>-city/ folder the filler HOUSES of a
; city are drawn from, matched on the same terrain keywords. A style folder
; present in template/ but absent here is used as a random fallback, so adding
; a style is just dropping a folder in template/ — but a style left unmapped
; lands on any terrain, which is what made so many towns look wrong.
; Every SHIPPED style is mapped here, one per [terrain] band, matched on the
; drawn art: sea-city white stone + blue shopfront -> the coast; med-city white
; walls + terracotta -> the dry scrub; desert-city adobe + arches -> the sand;
; paris-city zinc roofs and red-city red roofs -> the two grass bands;
; flat-roof-city grey concrete -> the mountains; brown-city all wood -> the snow.
; The ORDER is the whole meaning: the FIRST rule whose terrain covers at least
; 10% of the town surroundings wins, so the rules go from the most DISTINCTIVE
; terrain to the most common. A town is a sea town as soon as it has a coast; it
; falls through to the grass style only when nothing more specific is near.
; ("most tiles wins" gave 57 towns of 83 the same grass style.)
; A keyword is matched as a SUBSTRING of the terrain name, so "grass" also
; matches "grass2": the specific rule must come first, hence sand2 before sand.
cityStyleTerrains="sea-city->water;brown-city->snow;flat-roof-city->mountain;med-city->sand2;desert-city->sand;paris-city->grass2;red-city->grass"
typeXml=
; key-building / bot generation (CatchChallenger-datapack).
; shopItems = numeric item ids that exist in items/items.xml.
; *Skin = a folder NAME under skin/bot (or skin/fighter), NOT an index.
; botSkins = random pool for road/house/trainer NPCs.
botSkins="franck,oldman,florist,farmer,smith,alphonse,captain"
doGym=true
gymLeaderSkin=soldier
gymTrainerSkin=smith
gymTrainers=3
healSkin=oldgirl
; waterWalkItems: what the target datapack's map/layers.xml asks for to WALK ON
; the Water layer (<monstersCollision layer="Water" type="walkOn" item="N">).
; EVERY coastal town sells them whatever its level — without the item the engine
; refuses to step on water and the sea routes cannot be swum. Running with
; --datapack <dir> reads the real list off that datapack and replaces this one.
waterWalkItems=31
shopItems="1,2,3,5,6"
shopSkin=bankier

[water]
; A WATER BODY is a connected component of the Water layer. seaMinTiles is what
; separates a SEA — big enough to sail, and the only thing a water path is ever
; routed on — from a LAKE: a pond in a field must never become a shipping lane.
; A body of at least lakeMinTiles (and under seaMinTiles) is a LAKE; anything
; smaller is a puddle, not named and not drawn by terrainDebug.
; A SEA is BIG and LONG: seaMinSpan is the longest side of its bounding box, so
; a round inland lake never becomes a shipping lane whatever its size.
seaMinTiles=20000
seaMinSpan=500
lakeMinTiles=200
; debug outlines are traced on a DOWNSAMPLED grid of this many tiles per block:
; at tile resolution a noisy coastline gives over a million corners
bodyDebugStep=32
; pathPercentOfLand: EXTRA sea routes beyond the ones that join two LAND MASSES,
; as a percent of the land road count. Those joins are always built — they are
; what the sea is for. An extra route links two towns of the SAME continent,
; which the road already joins, so it buys scenery only: 0 by default.
; chunkSeaPercent: how much of a chunk must be sea for a route to sail through it.
; boatPercent: share of the crossings made BY BOAT rather than by a swimmable
; lane. 0 asks for a lane every time; a crossing still falls back to a boat when
; no lane can be sailed — the sea has to be free from one town's harbour to the
; other's, over chunks no road has taken. The lane follows the water, it is
; walled by a fluctuating rock line that also closes the map borders, and it
; carries the islands, the moored ship and the swimmers.
pathPercentOfLand=0
chunkSeaPercent=25
boatPercent=40
; how many chunks from a town the coast may be for it to count as a PORT: with 1
; most towns had no sea at all and two whole land masses could not be joined
harbourChunkRadius=3
; ...and how far for it to count as COASTAL, which is a different and much
; tighter thing: a coastal town is one the player sees the sea from, and it is the
; only place the water walk item is sold. With the harbour radius that was more
; than half the towns of the world.
coastalChunkRadius=0
; ...and only portCityPercent of the towns may put to sea at all. Every coastal
; town growing a harbour left the world covered in ferries. The land mass joins
; ignore this — they are what the sea is for and must always be possible.
portCityPercent=30
; SHORTCUT crossings, so the player never has to tour the whole world. Two towns
; the road already joins are normally forbidden to be linked by sea — the road is
; the link. The exception is a DETOUR: when going from one to the other costs at
; least shortcutMinDetour maps on the road graph AND the sea route costs at most
; shortcutMaxPercent of that, the crossing is built. Each one shortens the graph,
; so the next candidate is measured on the world as it now is and the rule dries
; up on its own. 0 for shortcutMinDetour switches shortcuts off, and that is the
; DEFAULT when the key is absent: a shortcut is an opt-in, this file asks for it.
shortcutMinDetour=20
shortcutMaxPercent=20
; The CHANNEL painted across a sea chunk: a corridor of water channelHalfWidth
; tiles either side of the travel axis, walled by the borderTile rock. The wall
; is a CONTINUOUS chain whose position wanders by up to wanderAmplitude tiles,
; so it does not read as a drawn corridor; what lies beyond it is never
; reachable, which is what stops the player getting lost in the open sea.
borderTile=rename/64
channelHalfWidth=6
wanderAmplitude=3
; ISLANDS inside the channel: islandPercent of the chunks get one of at least
; islandMinTiles tiles, mountain core, ringed by at most islandSandMax tiles of
; sand. islandLandablePercent of them are walkable islets, the rest bare rock.
islandPercent=35
islandMinTiles=20
islandSandMax=2
islandLandablePercent=50
; swimmers met on the channel
minFighter=1
maxFighter=3
; The two ships of tileset/ships.tsx, as "tsx/id,width,height": the sprite is a
; block of the sheet, stamped straight onto the Collisions layer — there is no
; tmx for them. shipDecoration is moored in the channel as scenery; shipUsable
; is the boat of a closed crossing and carries the push-teleport to the far
; shore. Both are only ever placed on free WATER.
shipDecoration="ships/0,6,3"
; the moored ship is scenery: it must stay RARE, well under 10% of the maps
shipDecorationPercent=8
shipUsable="ships/6,4,3"
