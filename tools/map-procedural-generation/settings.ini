[building]
; gymTypes: each gym picks one type; part of the trainer teams comes from the
; type monster pool and the gym facade is recolored with the type color
; (gym-<type> tileset generated into dest/map/tileset/ from tileset/gym.png).
; Colors copied from CatchChallenger-datapack/monsters/type.xml; typeXml can
; point to that file to read them at runtime instead.
gymTypes="fire:#f38233->Panthera fira,Vivicinder;water:#2E9EF3->Dinoflop,Pharfan,Rhinocarpe;plant:#71DA5E->Conileaf,Viviphyta,Cowpignon;poison:#B46DC5->Chenipode,Exapode,Snaki;electric:#FFEC10->Coleorus,Vivitron;stone:#BF904E->Polyrock,Selket,Galnec;ice:#75E7F3->Toufigel"
; a city takes the type whose terrain keywords match its surroundings; the
; gym type follows the city type; counts stay balanced across the world
cityTypeTerrains="water->water;stone->mountain,sand;plant->grass;ice->snow"
; cityStyleTerrains: which template/<style>-city/ folder the filler HOUSES of a
; city are drawn from, matched on the same terrain keywords. A style folder
; present in template/ but absent here is used as a random fallback, so adding
; a style is just dropping a folder in template/ — but a style left unmapped
; lands on any terrain, which is what made so many towns look wrong.
; Every SHIPPED style is mapped here, one per [terrain] band, matched on the
; drawn art: sea-city white stone + blue shopfront -> the coast; med-city white
; walls + terracotta -> the dry scrub; desert-city adobe + arches -> the sand;
; paris-city zinc roofs and red-city red roofs -> the two grass bands;
; flat-roof-city grey concrete -> the mountains; brown-city all wood -> the snow.
; The ORDER is the whole meaning: the FIRST rule whose terrain covers at least
; 10% of the town surroundings wins, so the rules go from the most DISTINCTIVE
; terrain to the most common. A town is a sea town as soon as it has a coast; it
; falls through to the grass style only when nothing more specific is near.
; ("most tiles wins" gave 57 towns of 83 the same grass style.)
; A keyword is matched as a SUBSTRING of the terrain name, so "grass" also
; matches "grass2": the specific rule must come first, hence sand2 before sand.
cityStyleTerrains="sea-city->water;brown-city->snow;flat-roof-city->mountain;med-city->sand2;desert-city->sand;paris-city->grass2;red-city->grass"
typeXml=
; key-building / bot generation (CatchChallenger-datapack).
; shopItems = numeric item ids that exist in items/items.xml.
; *Skin = a folder NAME under skin/bot (or skin/fighter), NOT an index.
; botSkins = random pool for road/house/trainer NPCs.
botSkins="franck,oldman,florist,farmer,smith,alphonse,captain"
doGym=true
gymLeaderSkin=soldier
gymTrainerSkin=smith
gymTrainers=3
healSkin=oldgirl
shopItems="1,2,3,5,6"
shopSkin=bankier
